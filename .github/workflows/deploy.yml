name: CI/CD & SEO Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-audit:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint & Type Check
      run: |
        npm run lint
        npx tsc --noEmit

    - name: Run Metadata Validation Audit
      run: node scripts/audit-metadata.mjs

    - name: Build Next.js
      run: npm run build

    - name: Start Next.js Server in Background
      run: |
        npm run start &
        echo $! > .next_pid
        sleep 5 # Wait for server to boot

    - name: Run Infrastructure Audit (Strict Launch Protocol)
      run: node scripts/audit-infrastructure.mjs http://localhost:3000

    - name: Cleanup Server
      if: always()
      run: kill $(cat .next_pid)

  deploy:
    needs: build-and-audit
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Deploy to Vercel
      run: echo "Vercel GitHub integration handles deployment."

    - name: Submit Sitemaps to GSC
      env:
        GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
      run: node scripts/submit-sitemaps.js

    - name: Slack Notification
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        fields: repo,message,commit,author,action,eventName,ref,workflow
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}